spring.application.name=liber

server.servlet.context-path=/api/v1
server.port=8080

spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=exam_liber;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=admin
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

#PascalCase @Entity naming convention
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Jackson configuration for enum handling
spring.jackson.deserialization.read-unknown-enum-values-as-null=false
spring.jackson.mapper.accept-case-insensitive-enums=true

logging.level.org.springframework.security=DEBUG
